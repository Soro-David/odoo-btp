[options]
; ==============================================================================
; Configuration Odoo Community - BTP Manager (Mode Développement)
; ==============================================================================

; Chemins des modules : modules officiels + modules personnalisés BTP
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Emplacement du stockage persistant (filestore, sessions, etc.)
data_dir = /var/lib/odoo

; Mot de passe Master pour la gestion des bases de données
admin_passwd = admin_master_btp_pwd_2026

; Paramètres de connexion PostgreSQL (réseau Docker interne)
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_btp_secret_pwd_2026

; Mode Développement :
; workers = 0 active le mode multithread (idéal dev : logs directs, support des debuggers)
workers = 0
max_cron_threads = 1

; Niveaux de logs
log_level = info
logfile = False

; Tolérances de temps d'exécution (évite les timeouts lors de l'installation de modules BTP lourds)
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

; Gestion HTTP
proxy_mode = False
xmlrpc = True
xmlrpc_port = 8069
